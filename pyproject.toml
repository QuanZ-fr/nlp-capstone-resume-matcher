[project]
name = "nlp-capstone-resume-matcher"
version = "0.1.0"
description = "Resume matcher: classify a resume, find the closest job offers and the missing skills"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "datasets>=3.0",
    "huggingface-hub>=0.34,<1.0",
    "gradio>=4.44",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
